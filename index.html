<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芽芽探險隊：高一單字大冒險</title>
<style>
:root{
  --ink:#27421f; --card:#fffdf2; --card2:#fff8d6; --line:#e5d9a0;
  --leaf:#4caf50; --leaf-d:#2e7d32; --sun:#ffc83d; --red:#ef5350; --blue:#4a90e2; --pink:#ff7aa8; --purple:#9b59b6;
  --shadow:0 6px 0 rgba(60,90,30,.22), 0 12px 24px rgba(40,70,20,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Nunito","Baloo 2","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(#8fd3ff 0%,#c8f0ff 38%,#eaffd0 62%,#9be36b 100%) fixed;
  overflow-x:hidden;
}
/* scenery */
#scenery{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.hill{position:absolute;bottom:-20vh;border-radius:50%}
.h1{left:-15vw;width:70vw;height:55vh;background:#78cf4f;box-shadow:inset 0 14px 0 #93df66}
.h2{right:-20vw;width:80vw;height:48vh;background:#62bd3f;box-shadow:inset 0 14px 0 #7bd154}
.h3{left:20vw;width:70vw;height:30vh;background:#52a933;box-shadow:inset 0 10px 0 #67bd45}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:50%;height:160%;left:15%;top:-70%}
.cloud:after{width:40%;height:130%;right:15%;top:-50%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(#fff,#fff5a0 60%,transparent 70%);animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(20px,-40px);opacity:1}}
#app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:14px 14px 80px}
h1,h2,h3{margin:.2em 0}
/* ui */
.btn{font:inherit;font-weight:800;border:0;border-radius:18px;padding:12px 22px;cursor:pointer;color:#fff;background:var(--leaf);box-shadow:0 5px 0 var(--leaf-d);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.sun{background:var(--sun);color:#5a3b00;box-shadow:0 5px 0 #d19a12}
.btn.red{background:var(--red);box-shadow:0 5px 0 #b3302d}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #2b66b3}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9c9a8}
.btn.sm{padding:6px 14px;font-size:.9rem;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topbar .title{flex:1;font-weight:900;font-size:1.25rem;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem}
.spk{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 0 #2b66b3;flex:none}
.spk.sm{width:34px;height:34px;font-size:1rem}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #2b66b3}
/* home */
.hero{text-align:center;padding-top:4vh}
.logo{font-size:clamp(2rem,6vw,3.6rem);font-weight:900;color:#fff;-webkit-text-stroke:2px #2e7d32;text-shadow:0 5px 0 #2e7d32,0 10px 20px rgba(0,0,0,.2);letter-spacing:2px}
.sub{font-weight:800;background:#fff;display:inline-block;padding:4px 16px;border-radius:99px;border:2px solid var(--line)}
.parade{display:flex;justify-content:center;gap:4px;margin:18px 0;flex-wrap:wrap}
.menu{display:grid;gap:14px;max-width:420px;margin:18px auto}
.menu .btn{font-size:1.2rem;padding:16px}
/* pikmin */
.pik{overflow:visible;display:block}
.pik .sway{transform-origin:30px 34px;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.bob{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hop{animation:hop .6s ease-in-out 3}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
/* map */
.area{margin-bottom:18px}
.area h2{display:flex;gap:10px;align-items:center}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.lv{position:relative;text-align:center;padding:12px 8px;border-radius:20px;border:3px solid var(--line);background:var(--card2);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12);font-weight:800}
.lv:hover{transform:translateY(-3px)}
.lv.lock{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.lv .ico{font-size:2rem}
.lv small{display:block;font-weight:600;opacity:.75}
.stars{letter-spacing:2px;color:#f5a800;text-shadow:0 1px 0 #fff}
.stars .off{color:#ccc}
/* quiz */
.track{position:relative;height:104px;border-radius:22px;border:3px solid rgba(255,255,255,.7);overflow:hidden;margin-bottom:12px;background:linear-gradient(#bfeaff 0 35%,#8bd35e 35% 100%);box-shadow:var(--shadow)}
.track.A{background:linear-gradient(#bfeaff 0 35%,#8bd35e 35% 100%)}
.track.B{background:linear-gradient(#7c9fd0 0 35%,#3f8f4a 35% 100%)}
.track.D{background:linear-gradient(#2d2a4a 0 35%,#7a5a3a 35% 100%)}
.track.C{background:linear-gradient(#4b3a6b 0 35%,#4a7d8e 35% 100%)}
.track .onion{position:absolute;right:6px;bottom:6px;width:92px}
.track .onion.slurp{animation:slurp .45s}
@keyframes slurp{50%{transform:scale(1.15,.88)}}
.track .idle{position:absolute;left:10px;bottom:6px}
.carry{position:absolute;bottom:6px;left:60px;display:flex;align-items:flex-end;animation:walk 1.5s linear forwards}
.carry .pellet{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:2}
@keyframes walk{from{left:60px}to{left:calc(100% - 140px);opacity:1}}
.pellet{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7a8,#ffc83d 55%,#e09a00);border:2px solid #b87400;font-weight:900;font-size:.8rem;display:grid;place-items:center;color:#7a4b00}
.count{position:absolute;right:104px;top:8px;background:#fff;border-radius:99px;padding:2px 12px;font-weight:900;border:2px solid var(--line)}
.prog{height:14px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;margin-bottom:12px;border:2px solid #fff}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ee34d,#ffd23d);transition:width .4s}
.qbox{text-align:center}
.scn{font-size:.95rem;font-weight:700;background:#fff;border-radius:14px;padding:6px 12px;display:inline-block;margin-bottom:10px;border:2px dashed var(--line)}
.bigword{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:900;letter-spacing:1px;margin:6px 0}
.sent{font-size:clamp(1.15rem,3.6vw,1.6rem);font-weight:700;line-height:1.5;margin:10px 0}
.sent b{color:#d2381b;background:#fff0a6;border-radius:6px;padding:0 4px}
.blank{display:inline-block;min-width:96px;border-bottom:4px solid var(--ink);text-align:center;color:#d2381b}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-weight:800;font-size:1.1rem;padding:14px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 4px 0 #d4c78a;color:var(--ink)}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#b8f0a8;border-color:#4caf50}
.opt.no{background:#ffc9c4;border-color:var(--red);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:14px;padding:12px 14px;border-radius:18px;text-align:left;display:none}
.fb.show{display:block}
.fb.good{background:#e0f8d4;border:3px solid #7ac75e}
.fb.bad{background:#ffe6e2;border:3px solid #f08a82}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:42px;height:50px;border-bottom:4px solid var(--ink);font-size:1.8rem;font-weight:900;display:grid;place-items:center;background:#fff;border-radius:10px 10px 0 0}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;font:inherit;font-size:1.6rem;font-weight:900;border-radius:14px;border:3px solid #c28a00;background:linear-gradient(#ffe27a,#ffc83d);cursor:pointer;box-shadow:0 4px 0 #c28a00;color:#5a3b00}
.tile.used{visibility:hidden}
/* learn card */
.lcard{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
@media(max-width:700px){.lcard{grid-template-columns:1fr}}
.pos{display:inline-block;background:var(--purple);color:#fff;border-radius:99px;padding:2px 12px;font-weight:800;font-size:.9rem}
.tip{background:#fff3b0;border-radius:16px;padding:10px 14px;margin:10px 0;font-weight:700}
.exs{background:#fff;border-radius:16px;border:2px solid var(--line);padding:10px 14px}
/* dashboard */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.kpi b{display:block;font-size:1.9rem;line-height:1.1}
.kpi span{font-size:.85rem;font-weight:700;opacity:.75}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.wc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;font-weight:800;cursor:pointer}
.wc small{display:block;font-weight:600;opacity:.7}
.meter{height:8px;border-radius:9px;background:#eee;margin:4px 8px 0;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#8ee34d,#ffd23d)}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700;font-size:.92rem}
.bar .lab{width:92px;flex:none}
.bar .tr{flex:1;height:16px;background:#eee;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.modal{position:fixed;inset:0;background:rgba(20,40,10,.55);z-index:10;display:grid;place-items:center;padding:14px}
.modal .card{max-width:640px;width:100%;max-height:92vh;overflow:auto}
input[type=text]{font:inherit;padding:10px 14px;border-radius:14px;border:3px solid var(--line);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.note{font-size:.85rem;opacity:.75}
</style>
</head>
<body>
<div id="scenery">
  <div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
</div>
<div id="app"></div>

<script>
/* ============ 單字資料 (en, 詞性, 中文, 例句, 例句中譯, 記憶小撇步) ============ */
const W_EN=[
["progress","n./v.","進步；進展","Students make steady progress when they review every day.","學生每天複習就會穩定進步。","pro(向前)+gress(走) → 往前走 = 進步"],
["preservation","n.","保存；保護","The preservation of old temples needs money and care.","古老寺廟的保存需要金錢與用心。","preserve(保存)+ation；果醬 jam 就是保存水果的方法"],
["glimpse","n./v.","一瞥；瞥見","I caught a glimpse of a rare bird in the forest.","我在森林裡瞥見一隻稀有的鳥。","和 glance(看一眼) 長得像，都是「快速看一下」"],
["identity","n.","身分；認同","Language is an important part of a person's identity.","語言是一個人身分認同的重要部分。","identical(相同的)→ 「我就是我」的同一性 = 身分"],
["development","n.","發展；開發","The development of new technology changes our lives.","新科技的發展改變了我們的生活。","develop(發展)+ment 變名詞；de(解開)+velop(包裹) → 攤開來"],
["treasure","n./v.","寶藏；珍視","The children found a hidden treasure in the cave.","孩子們在洞穴裡發現了隱藏的寶藏。","海盜的 treasure map = 藏寶圖；當動詞是「珍視」"],
["replace","v.","取代；替換","We need to replace the broken lamp.","我們需要更換壞掉的燈。","re(再)+place(放) → 重新放一個上去 = 取代"],
["endanger","v.","危及；使瀕危","Plastic waste can endanger sea animals.","塑膠垃圾可能危害海洋動物。","en(使)+danger(危險) → 使陷入危險；endangered species 瀕危物種"],
["abundance","n.","豐富；大量","The island has an abundance of fresh fruit.","這座島上有大量新鮮水果。","諧音 a-bun-dance：一堆麵包(bun)在跳舞 → 超級多"],
["campaign","n./v.","活動；運動","Our school started a campaign to save energy.","我們學校發起了節約能源的活動。","camp(營地)：軍隊紮營出征 → 戰役 → 宣傳活動"],
["conclude","v.","結束；推斷","Let's conclude the lesson with a short quiz.","我們用一個小測驗來結束這堂課。","con(完全)+clude(關閉) → 完全關上 = 結束；名詞 conclusion"],
["transport","v./n.","運輸；交通","Trucks transport food from farms to cities.","卡車把食物從農場運到城市。","trans(跨越)+port(搬運) → 搬過去；airport、export 同字根"],
["situated","adj.","位於…的","The hotel is situated near the beach.","這間飯店位於海灘附近。","situation(情況)→ 所處的位置；be situated in/near…"],
["drown","v.","淹死；淹沒","Don't swim alone, or you may drown.","不要單獨游泳，否則你可能會溺水。","聯想 down：往下沉 → 溺水"],
["spare","adj./v.","多餘的；騰出","Can you spare a few minutes to help me?","你能抽出幾分鐘幫我嗎？","spare tire = 備胎(多出來的)；spare time = 空閒時間"],
["priceless","adj.","無價的","The old painting is priceless.","那幅古畫是無價之寶。","price(價格)+less(無) → 無法標價；-less 表示「沒有」"],
["relieve","v.","減輕；緩解","A short walk can relieve stress.","短暫散步可以減輕壓力。","re+lieve(舉起 lever) → 把重擔舉起來 = 減輕；名詞 relief"],
["urban","adj.","都市的","Urban areas are usually crowded and busy.","都市地區通常擁擠又繁忙。","對比 rural(鄉村的)；suburb 郊區 = 都市下方(sub)"],
["resident","n.","居民","Every resident of the town loves the new park.","小鎮的每位居民都喜愛這座新公園。","reside(居住)+ent(人) → 住在那裡的人；residence 住所"],
["crucial","adj.","關鍵的","Sleep is crucial for good health.","睡眠對健康至關重要。","來自 cross(十字路口)：站在路口做決定 = 關鍵時刻"],
["urgent","adj.","緊急的","She received an urgent message from her mom.","她收到媽媽傳來的緊急訊息。","urge(催促)+ent → 被催著要做 = 緊急；名詞 urgency"],
["enormous","adj.","巨大的","An enormous tree stood in the middle of the field.","一棵巨大的樹矗立在田野中央。","e(出)+norm(標準) → 超出標準 = 巨大"],
["mission","n.","任務；使命","Their mission is to clean up the river.","他們的任務是清理這條河。","miss/mit = 送出去 → 被派出去的事 = 任務；missionary 傳教士"],
["fond","adj.","喜愛的","My grandfather is fond of growing flowers.","我的爺爺喜歡種花。","固定用法 be fond of + N/V-ing，意思近似 like"]
].map((a,i)=>({id:i,en:a[0],pos:a[1],zh:a[2],s:a[3],sz:a[4],tip:a[5],art:a[6],f:a[7]}));
/* 德文單字：取自字幕「Lilly 失蹤記」(p02、p03)。欄位：單字, 詞性, 中文, 例句(字幕原句), 中譯, 記憶撇步, 冠詞, 句中出現的形式 */
const W_DE=[
["Küche","n.","廚房","Ich schaue in der Küche nach.","我到廚房找找看。","和英文 kitchen、cook 同源；陰性名詞","die","Küche"],
["Wohnzimmer","n.","客廳","Sie ist auch nicht im Wohnzimmer.","她也不在客廳。","wohnen(居住)＋Zimmer(房間) = 客廳","das","Wohnzimmer"],
["Zimmer","n.","房間","Ich habe gesagt, geh raus aus meinem Zimmer!","我說過了，從我的房間出去！","Wohn-/Schlaf-/Kinderzimmer 都用它組合；中性","das","Zimmer"],
["Garten","n.","花園","Opa, vielleicht ist sie im Garten?","爺爺，她會不會在花園裡？","幾乎等於英文 garden；Kindergarten 就是「小孩的花園」","der","Garten"],
["Straße","n.","街道；馬路","Auf der Straße ist sie auch nicht.","她也不在街上。","像英文 street；ß 唸 ss","die","Straße"],
["Keller","n.","地下室","Habt ihr schon im Keller nachgesehen?","你們已經檢查過地下室了嗎？","同源於英文 cellar","der","Keller"],
["Haus","n.","房子；家","Da ist unser Haus, endlich!","我們的家到了，終於！","像英文 house；nach Hause = 回家","das","Haus"],
["Katze","n.","貓","Hier ist nur die Katze, Oma.","這裡只有貓咪，奶奶。","像英文 cat；Katze 唸「卡策」","die","Katze"],
["suchen","v.","尋找","Ganz ruhig, wir suchen sie zusammen.","別慌，我們一起找她。","ich suche, du suchst, wir suchen；像英文 seek","","suchen"],
["finden","v.","找到；覺得","Wir finden sie, das verspreche ich dir.","我們會找到她，我向你保證。","就是英文 find；過去分詞 gefunden","","finden"],
["spielen","v.","玩；遊玩","Sie wollte mit mir spielen.","她想要跟我玩。","Spiel = play/game；mit jemandem spielen 和某人玩","","spielen"],
["fragen","v.","詢問","Wir müssen die Nachbarn fragen.","我們得去問問鄰居。","fragen = ask；Frage 是「問題」","","fragen"],
["sehen","v.","看見","Niemand hat sie gesehen, Opa.","沒有人看見她，爺爺。","sehen = see；完成式 hat gesehen（句中為過去分詞）","","gesehen"],
["helfen","v.","幫助","Die Polizei hilft uns bestimmt, Leo.","警察一定會幫我們的，Leo。","helfen = help；不規則變化 er/sie hilft (e→i)","","hilft"],
["sagen","v.","說","Und ich habe gesagt, nicht jetzt.","而我說了：現在不行。","sagen = say；完成式 hat gesagt（句中為過去分詞）","","gesagt"],
["lesen","v.","閱讀","Du hast hier ganz allein gelesen.","你一個人在這裡看書。","lesen = read；完成式 hat gelesen（句中為過去分詞）","","gelesen"],
["Angst","n.","恐懼；害怕","Oma, ich habe solche Angst.","奶奶，我好害怕。","英文也借用 angst 這個字；Angst haben = 感到害怕","die","Angst"],
["Hilfe","n.","幫助；救援","Guten Abend, wir brauchen dringend Hilfe.","晚安，我們急需協助。","helfen 的名詞；Hilfe! 就是「救命！」","die","Hilfe"],
["Polizei","n.","警察；警局","Wir müssen jetzt zur Polizei gehen.","我們現在得去警察局。","像英文 police；zur = zu＋der","die","Polizei"],
["Enkelin","n.","孫女；外孫女","Unsere Enkelin ist verschwunden.","我們的孫女失蹤了。","Enkel(孫子)＋-in(女性字尾)","die","Enkelin"],

function speakOnline(t,slow){

  try{curAudio&&curAudio.pause();

function speak(t,slow){
  if("speechSynthesis" in window){speechSynthesis.cancel();pickVoice()}
  if(curAudio){curAudio.pause()}
  if(!hasVoice()){return speakOnline(t,slow)}
  const u=new SpeechSynthesisUtterance(t);u.lang=LANG==="de"?"de-DE":"en-US";u.voice=voice;

let actx;
function tone(f,d,type="sine",delay=0,vol=.15){
  if(S.mute)return;try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  const t=actx.currentTime+delay;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}
}

  const dim=stage===0?'style="filter:grayscale(1) opacity(.4)"':'';

    S.log.push({ts:Date.now(),lv:r.l.id,type:"learn",c:r.l.words.length,t:r.l.words.length,sec:Math.round((Date.now()-r.t0)/1000)});
    markDay();save();sfx.win();
    return view(`<div class="card center"><h2>🎉 教學完成！</h2><div class="parade">${r.l.words.map(i=>`<div class="bob" style="animation-delay:${i%5*.1}s">${pik(i,1,{size:44})}</div>`).join("")}</div><p>你已經認識這 8 個單字囉，接下來去練習讓它們長大吧！</p><button class="btn" onclick="startLevel(${r.k+1})">下一關：練習 ▶</button> <button class="btn ghost" onclick="map()">回地圖</button></div>`);
  }
  learnRun.idx+=d;renderLearn();
}
function dict(){
  let h=`<div class="topbar"><button class="btn ghost sm" onclick="home()">← 首頁</button><div class="title">📚 單字圖鑑</div></div><div class="note" style="margin-bottom:8px">點任何一張卡片查看中文、例句與發音。</div><div class="wgrid">`;
  W.forEach(w=>h+=`<div class="wc" onclick="openCard(${w.id})">${pik(w.id,wst(w.id),{size:44})}${w.id+1}. ${dsp(w)}<small>${w.zh}</small></div>`);
  view(h+"</div>");
}
function openCard(i){
  const m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>No.${i+1}</b><button class="btn ghost sm" onclick="this.closest('.modal').remove()">✕ 關閉</button></div>${cardHTML(i)}</div>`;
  document.body.appendChild(m);speak(dsp(W[i]));
}

/* ============ 測驗引擎 ============ */
let run=null;
function startLevel(k){
  const l=LEVELS[k];if(!l)return map();
  if(l.type==="learn")return startLearn(k);
  let qs;
  if(l.type==="final")qs=shuffle(l.words).slice(0,24).map(i=>({type:shuffle(["meaning","listen","cloze","spell"])[0],i}));
  else qs=shuffle(l.words).map(i=>({type:l.type,i}));
  begin({k,l,id:l.id,type:l.type,area:l.area,qs});
}
function startReview(){
  const ws=W.map(w=>{const s=S.words[w.id]||{c:0,w:0,m:0,n:0};return {i:w.id,sc:s.m-(s.w*2)+(s.n?0:-1)}}).sort((a,b)=>a.sc-b.sc).slice(0,8).map(x=>x.i);
  begin({k:-1,l:{id:"review"},id:"review",type:"review",area:AREAS[0],qs:shuffle(ws).map(i=>({type:shuffle(["meaning","listen","cloze","spell"])[0],i}))});
}
function begin(r){run=Object.assign({idx:0,ok:0,delivered:0,t0:Date.now(),types:{}},r);question()}
function opts(i,key){
  const pool=W.filter(w=>w.id!==i),same=shuffle(pool.filter(w=>w.pos===W[i].pos)),rest=shuffle(pool.filter(w=>w.pos!==W[i].pos));
  return shuffle([i,...[...same,...rest].slice(0,3).map(w=>w.id)]);
}
function question(){
  const q=run.qs[run.idx],w=W[q.i],T=TYPES[run.type],total=run.qs.length;
  run.locked=false;run.hint=0;
  let body="";
  if(q.type==="meaning"){q.o=opts(q.i);
    body=`<div class="bigword">${dsp(w)}</div><div class="row" style="justify-content:center"><button class="spk" data-say="${dsp(w)}">🔊</button></div><p class="note">這個單字是什麼意思？</p><div class="opts">${q.o.map(o=>`<button class="opt" onclick="pickOpt(${o})" data-o="${o}">${W[o].pos} ${W[o].zh}</button>`).join("")}</div>`}
  if(q.type==="listen"){q.o=opts(q.i);
    body=`<div class="row" style="justify-content:center;margin:10px 0"><button class="spk" style="width:84px;height:84px;font-size:2.4rem" data-say="${dsp(w)}">🔊</button><button class="spk" style="background:#8a8" data-say="${dsp(w)}" data-slow="1">🐢</button></div><p class="note">按喇叭聽發音，選出你聽到的單字</p><div class="opts">${q.o.map(o=>`<button class="opt" onclick="pickOpt(${o})" data-o="${o}">${dsp(W[o])}</button>`).join("")}</div>`}
  if(q.type==="cloze"){q.o=opts(q.i);
    const s=w.s.replace(wre(w),'<span class="blank">　　</span>');
    body=`<div class="sent">${s}</div><div class="note">${w.sz}</div><p class="note">選出最適合填入空格的單字</p><div class="opts">${q.o.map(o=>`<button class="opt" onclick="pickOpt(${o})" data-o="${o}">${frm(W[o])}</button>`).join("")}</div>`}
  if(q.type==="spell"){
    run.tiles=shuffle([...w.en]).map(c=>({c,u:false}));run.fill=[];
    body=`<div class="row" style="justify-content:center"><button class="spk" data-say="${dsp(w)}">🔊</button><b style="font-size:1.6rem">${w.art?`<span class="pos">${w.art}</span> `:""}${w.pos} ${w.zh}</b></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost sm" onclick="spUndo()">⌫ 退回</button><button class="btn ghost sm" onclick="spHint()">💡 提示</button></div><div class="note" id="hint"></div>`}
  view(`<div class="topbar"><button class="btn ghost sm" onclick="if(confirm('離開本關？目前進度不會儲存'))map()">← 離開</button><div class="title">${T.ico} ${T.n}</div><span class="chip">${run.idx+1} / ${total}</span></div>
   <div class="prog"><i style="width:${run.idx/total*100}%"></i></div>
   <div class="track ${run.area.id}" id="track">${onionSvg(["#ff7b54","#7a63d6","#43b8d8","#e0a030"]["ABCD".indexOf(run.area.id)])}<div class="count">🍯 <span id="cnt">${run.delivered}</span></div><div class="idle bob">${pik(q.i,Math.max(1,wst(q.i)),{size:50})}</div></div>
   <div class="card qbox"><div class="scn">📜 ${TYPES[q.type==="spell"||q.type==="listen"||q.type==="cloze"||q.type==="meaning"?q.type:"meaning"].scn}</div>${body}
    <div class="fb" id="fb"></div><div id="nextbox" style="margin-top:12px"></div></div>`);
  if(q.type==="spell")spRender();
  if(q.type==="listen")setTimeout(()=>speak(dsp(w)),300);
}
function spRender(){
  const w=W[run.qs[run.idx].i];
  $("#slots").innerHTML=[...w.en].map((_,k)=>`<div class="slot">${run.fill[k]!==undefined?run.tiles[run.fill[k]].c:""}</div>`).join("");
  $("#tiles").innerHTML=run.tiles.map((t,k)=>`<button class="tile ${t.u?"used":""}" onclick="spPick(${k})">${t.c}</button>`).join("");
}
function spPick(k){if(run.locked||run.tiles[k].u)return;sfx.pop();run.tiles[k].u=true;run.fill.push(k);spRender();
  const w=W[run.qs[run.idx].i];if(run.fill.length===w.en.length){const a=run.fill.map(x=>run.tiles[x].c).join("");answer(a===w.en,a)}}
function spUndo(){if(run.locked||!run.fill.length)return;run.tiles[run.fill.pop()].u=false;spRender()}
function spHint(){const w=W[run.qs[run.idx].i];run.hint++;$("#hint").textContent=`提示：共 ${w.en.length} 個字母，以「${w.en[0]}」開頭，以「${w.en.slice(-1)}」結尾`}
function pickOpt(o){
  if(run.locked)return;const q=run.qs[run.idx];
  document.querySelectorAll(".opt").forEach(b=>{const v=+b.dataset.o;if(v===q.i)b.classList.add("ok");else if(v===o)b.classList.add("no")});
  answer(o===q.i,o);
}
function answer(ok,chosen){
  if(run.locked)return;run.locked=true;
  const q=run.qs[run.idx],w=W[q.i];
  const ws=S.words[q.i]=S.words[q.i]||{n:1,m:0,c:0,w:0};ws.n=ws.n||1;
  const ty=S.types[q.type]=S.types[q.type]||{c:0,w:0};
  const good=ok&&!(q.type==="spell"&&run.hint>1);
  if(ok){ws.c++;ty.c++;ws.m=Math.min(8,ws.m+(run.hint?.5:1));run.ok++;sfx.ok();deliver()}
  else{ws.w++;ty.w++;ws.m=Math.max(0,ws.m-1);sfx.no();const t=$("#track");t.insertAdjacentHTML("beforeend",`<div class="carry" style="animation:none;left:90px;font-size:2rem">❗</div>`);setTimeout(()=>t.querySelector(".carry")?.remove(),900)}
  ws.last=Date.now();
  (run.types[q.type]=run.types[q.type]||{c:0,t:0}).t++;if(ok)run.types[q.type].c++;
  save();
  const fb=$("#fb");fb.className="fb show "+(ok?"good":"bad");
  fb.innerHTML=`<b>${ok?"✅ 答對了！":"❌ 再接再厲！正確答案："+dsp(w)}</b><div style="margin:6px 0"><b>${dsp(w)}</b> <span class="pos">${w.pos}</span> ${w.zh}</div><div class="sent" style="font-size:1.1rem;margin:4px 0">${hl(w.s,w)}</div><div class="note" style="font-size:.95rem">${w.sz}</div><button class="btn blue sm" data-say="${esc(w.s)}">🔊 念句子</button>`;
  if(ok&&q.type!=="cloze")setTimeout(()=>speak(dsp(w)),200);
  if(!ok||q.type==="cloze")setTimeout(()=>speak(q.type==="cloze"?w.s:dsp(w)),350);
  $("#nextbox").innerHTML=`<button class="btn sun" onclick="nextQ()">${run.idx===run.qs.length-1?"看成績 🏁":"下一題 ▶"}</button>`;
}
function deliver(){
  const t=$("#track");if(!t)return;const q=run.qs[run.idx];run.delivered++;S.pellets++;
  t.insertAdjacentHTML("beforeend",`<div class="carry"><div class="pellet">${run.delivered}</div>${pik(q.i,Math.max(1,wst(q.i)),{size:46})}</div>`);
  setTimeout(()=>{const o=t.querySelector(".onion");if(!o)return;o.classList.add("slurp");setTimeout(()=>o.classList.remove("slurp"),500);const c=$("#cnt");c&&(c.textContent=run.delivered);t.querySelector(".carry")?.remove()},1500);
}
function nextQ(){speechSynthesis.cancel();run.idx++;if(run.idx>=run.qs.length)finish();else question()}
function markDay(){const d=today();if(!S.days.includes(d))S.days.push(d)}
function finish(){
  const t=run.qs.length,acc=run.ok/t,sec=Math.round((Date.now()-run.t0)/1000);
  const st=acc>=.9?3:acc>=.7?2:acc>=.5?1:0;
  if(run.id!=="review"){const r=S.levels[run.id]||{stars:0,best:0,attempts:0};S.levels[run.id]={stars:Math.max(r.stars,st),best:Math.max(r.best,Math.round(acc*100)),attempts:r.attempts+1}}
  S.log.push({ts:Date.now(),lv:run.id,type:run.type,c:run.ok,t,sec,ty:run.types});markDay();save();
  st>=1?sfx.win():sfx.no();
  const nextOK=run.k>=0&&run.k<LEVELS.length-1&&st>=1;
  const msg=st===3?"太厲害了！所有小芽芽都為你歡呼！":st===2?"表現優秀，再練一次就能拿三星！":st===1?"過關了！建議再練習錯題單字。":"還差一點，先回到教學關複習吧！";
  const wrong=[];
  view(`<div class="card center"><h2>${run.type==="final"?"🛸 總測驗結果":"🏁 關卡結果"}</h2>
   <div style="font-size:2.4rem">${stars(st)}</div>
   <div class="parade">${run.qs.slice(0,8).map((q,k)=>`<div class="${st?"hop":""}" style="animation-delay:${k*.1}s">${pik(q.i,Math.max(1,wst(q.i)),{size:46})}</div>`).join("")}</div>
   <div class="kpis"><div class="kpi"><b>${run.ok}/${t}</b><span>答對題數</span></div><div class="kpi"><b>${Math.round(acc*100)}%</b><span>正確率</span></div><div class="kpi"><b>${run.delivered}</b><span>本關花蜜</span></div><div class="kpi"><b>${sec}s</b><span>花費時間</span></div></div>
   <p><b>${msg}</b></p>
   <div class="row" style="justify-content:center">${nextOK?`<button class="btn" onclick="startLevel(${run.k+1})">下一關 ▶</button>`:""}<button class="btn sun" onclick="${run.k>=0?`startLevel(${run.k})`:"startReview()"}">↻ 再玩一次</button><button class="btn blue" onclick="dash()">🌱 看儀表板</button><button class="btn ghost" onclick="map()">回地圖</button></div></div>`);
}

/* ============ 儀表板 ============ */
function streak(){const d=new Set(S.days);let n=0,t=new Date();if(!d.has(today()))t.setDate(t.getDate()-1);
  while(true){const k=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");if(d.has(k)){n++;t.setDate(t.getDate()-1)}else break}return n}
function dash(){
  const A=W.reduce((a,w)=>{const s=S.words[w.id];if(s){a.c+=s.c;a.w+=s.w}return a},{c:0,w:0});
  const ans=A.c+A.w,acc=ans?Math.round(A.c/ans*100):0;
  const stc=[0,0,0,0];W.forEach(w=>stc[wst(w.id)]++);
  const mastery=Math.round(W.reduce((a,w)=>a+[0,.33,.66,1][wst(w.id)],0)/W.length*100);
  const totStars=LEVELS.reduce((a,l)=>a+((S.levels[l.id]||{}).stars||0),0);
  const mins=Math.round(S.log.reduce((a,l)=>a+l.sec,0)/60);
  const recent=S.log.filter(l=>l.type!=="learn").slice(-12);
  // bar chart
  let chart="";const bw=Math.min(40,300/Math.max(recent.length,1));
  recent.forEach((l,k)=>{const p=l.c/l.t,h=p*110,x=20+k*(bw+6),col=p>=.9?"#4caf50":p>=.7?"#ffc83d":"#ef5350";
    chart+=`<rect x="${x}" y="${130-h}" width="${bw}" height="${h}" rx="6" fill="${col}"/><text x="${x+bw/2}" y="${126-h}" font-size="10" text-anchor="middle" fill="#27421f">${Math.round(p*100)}</text>`});
  const types=Object.keys(TNAME).map(k=>{const t=S.types[k]||{c:0,w:0},n=t.c+t.w,p=n?Math.round(t.c/n*100):0;
    return `<div class="bar"><span class="lab">${TNAME[k]}</span><span class="tr"><i style="width:${p}%;background:${p>=80?"#4caf50":p>=60?"#ffc83d":"#ef5350"}"></i></span><b>${n?p+"%":"—"}</b></div>`}).join("");
  const weak=W.filter(w=>S.words[w.id]&&S.words[w.id].w>0).sort((a,b)=>{const x=S.words[a.id],y=S.words[b.id];return (y.w/(y.c+y.w))-(x.w/(x.c+x.w))}).slice(0,6);
  const levelsRows=LEVELS.map(l=>{const r=S.levels[l.id];return r?`<tr><td>${l.area.emoji} ${TYPES[l.type].n}${l.type==="final"?"":"（"+l.area.name+"）"}</td><td>${stars(r.stars)}</td><td>${r.best}%</td><td>${r.attempts}</td></tr>`:""}).join("");
  const logRows=S.log.slice(-8).reverse().map(l=>{const d=new Date(l.ts);return `<tr><td>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</td><td>${TYPES[l.type]?TYPES[l.type].n:l.type}</td><td>${l.c}/${l.t}</td><td>${l.sec}s</td></tr>`}).join("");
  view(`<div class="topbar"><button class="btn ghost sm" onclick="home()">← 首頁</button><div class="title">🌱 ${S.name?esc(S.name)+" 的":""}學習儀表板（${LANG==="de"?"德文":"英文"}）</div></div>${langBar()}
  <div class="kpis">
   <div class="kpi"><b>${mastery}%</b><span>單字精熟度</span></div>
   <div class="kpi"><b>${stc[3]}/${W.length}</b><span>已開花單字</span></div>
   <div class="kpi"><b>${acc}%</b><span>累計正確率 (${ans}題)</span></div>
   <div class="kpi"><b>${totStars}/${LEVELS.length*3}</b><span>獲得星星</span></div>
   <div class="kpi"><b>${streak()}</b><span>連續學習天數</span></div>
   <div class="kpi"><b>${mins}</b><span>累計分鐘</span></div>
   <div class="kpi"><b>${S.pellets}</b><span>花蜜收穫</span></div></div>
  <div class="card" style="margin-bottom:14px"><h3>🪴 單字花園（點擊單字可複習）</h3>
   <div class="note">未遇見 ${stc[0]} ・ 嫩葉 ${stc[1]} ・ 花苞 ${stc[2]} ・ 開花 ${stc[3]}　— 答對越多，小芽芽頭上的植物就長越大。</div>
   <div class="wgrid" style="margin-top:10px">${W.map(w=>{const s=S.words[w.id]||{c:0,w:0,m:0};return `<div class="wc" onclick="openCard(${w.id})">${pik(w.id,wst(w.id),{size:40})}${dsp(w)}<small>✔${s.c} ✘${s.w}</small><div class="meter"><i style="width:${s.m/8*100}%"></i></div></div>`}).join("")}</div></div>
  <div class="grid2">
   <div class="card"><h3>📈 最近測驗正確率 (%)</h3>${recent.length?`<svg viewBox="0 0 ${Math.max(340,40+recent.length*(bw+6))} 140" width="100%"><line x1="10" y1="130" x2="100%" y2="130" stroke="#ccc"/>${chart}</svg>`:'<p class="note">完成第一個練習關卡後，這裡會出現你的成績曲線。</p>'}</div>
   <div class="card"><h3>🎯 各題型正確率</h3>${types}</div>
   <div class="card"><h3>⚠️ 需要加強的單字</h3>${weak.length?weak.map(w=>{const s=S.words[w.id];return `<div class="bar"><span class="lab">${dsp(w)}</span><span class="tr"><i style="width:${Math.round(s.c/(s.c+s.w)*100)}%;background:#ffc83d"></i></span><b>${s.c}/${s.c+s.w}</b></div>`}).join("")+`<button class="btn red sm" onclick="startReview()">🩹 開始弱點複習</button>`:'<p class="note">目前沒有錯誤紀錄，繼續保持！</p><button class="btn red sm" onclick="startReview()">🩹 隨機弱點複習</button>'}</div>
   <div class="card"><h3>🗺️ 關卡成績</h3>${levelsRows?`<table><tr><th>關卡</th><th>星等</th><th>最佳</th><th>次數</th></tr>${levelsRows}</table>`:'<p class="note">尚未完成任何關卡。</p>'}</div>
   <div class="card"><h3>🕒 學習歷程</h3>${logRows?`<table><tr><th>時間</th><th>活動</th><th>成績</th><th>用時</th></tr>${logRows}</table>`:'<p class="note">尚無紀錄。</p>'}</div>
  </div>`);
}
function settings(){
  view(`<div class="topbar"><button class="btn ghost sm" onclick="home()">← 首頁</button><div class="title">⚙️ 設定</div></div>
  <div class="card"><div class="row"><label><input type="checkbox" ${S.slow?"checked":""} onchange="S.slow=this.checked;save()"> 預設慢速發音</label></div>
  <div class="row" style="margin-top:8px"><label><input type="checkbox" ${S.mute?"checked":""} onchange="S.mute=this.checked;save()"> 關閉音效</label></div>
  <div class="row" style="margin-top:8px"><label><input type="checkbox" ${S.teacher?"checked":""} onchange="S.teacher=this.checked;save()"> 老師模式（解鎖全部關卡）</label></div>
  <div class="row" style="margin-top:12px"><button class="btn blue sm" onclick="speak(LANG==='de'?'Hallo! Wir suchen Lilly zusammen.':'Hello! Let us explore the meadow together.')">🔊 測試發音</button><button class="btn ghost sm" onclick="exportData()">⬇️ 匯出學習紀錄 (JSON)</button><button class="btn red sm" onclick="if(confirm('確定清除所有學習紀錄？'))resetAll()">🗑️ 重設進度</button></div>
  <p class="note">學習紀錄儲存在此瀏覽器的 localStorage，不會上傳。發音優先使用電腦內建語音（Chrome / Edge / Safari）；若沒有該語言語音，會改用線上語音（需要網路，此時被朗讀的單字文字會傳到線上語音服務）。</p></div>`);
}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="pikmin_vocab_record.json";a.click()}
function resetAll(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
setLang(LANG);
home();
</script>
